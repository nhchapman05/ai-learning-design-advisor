<svg viewBox="0 0 720 580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>RAG Architecture: AI in Learning Design Advisor</title>
  <desc>Flow diagram showing user input flowing through FAISS retriever, knowledge base, and Three Friction Types Framework into Claude Haiku, producing a practitioner response.</desc>

  <rect width="720" height="580" fill="#f9f9f9"/>

  <text x="360" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">AI in Learning Design Advisor — RAG Architecture</text>

  <!-- USER INPUT -->
  <rect x="260" y="60" width="200" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">User Input</text>
  <text x="360" y="100" text-anchor="middle" font-size="11" fill="#2563eb">Practitioner question</text>

  <line x1="360" y1="112" x2="360" y2="148" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RETRIEVER -->
  <rect x="240" y="148" width="240" height="52" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="360" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">Retriever</text>
  <text x="360" y="188" text-anchor="middle" font-size="11" fill="#7c3aed">SentenceTransformer · all-MiniLM-L6-v2</text>

  <line x1="360" y1="200" x2="360" y2="236" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FAISS -->
  <rect x="240" y="236" width="240" height="52" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="360" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">FAISS Vector Store</text>
  <text x="360" y="276" text-anchor="middle" font-size="11" fill="#16a34a">Top 5 chunks retrieved</text>

  <line x1="240" y1="262" x2="166" y2="262" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="262" x2="554" y2="262" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- KNOWLEDGE BASE -->
  <rect x="30" y="228" width="136" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="98" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">Knowledge Base</text>
  <text x="98" y="268" text-anchor="middle" font-size="10" fill="#d97706">19 peer-reviewed</text>
  <text x="98" y="282" text-anchor="middle" font-size="10" fill="#d97706">learning science docs</text>

  <!-- THREE FRICTION TYPES -->
  <rect x="554" y="220" width="136" height="84" rx="8" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="622" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#be123c">Three Friction</text>
  <text x="622" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#be123c">Types Framework</text>
  <text x="622" y="278" text-anchor="middle" font-size="10" fill="#e11d48">Chapman, 2026</text>
  <text x="622" y="292" text-anchor="middle" font-size="10" fill="#e11d48">Diagnostic layer</text>

  <line x1="98" y1="296" x2="98" y2="358" stroke="#888" stroke-width="1.5"/>
  <line x1="98" y1="358" x2="282" y2="358" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="622" y1="304" x2="622" y2="358" stroke="#888" stroke-width="1.5"/>
  <line x1="622" y1="358" x2="438" y2="358" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="288" x2="360" y2="334" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PROMPT ASSEMBLY -->
  <rect x="220" y="334" width="280" height="52" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="360" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Prompt Assembly</text>
  <text x="360" y="374" text-anchor="middle" font-size="11" fill="#6b7280">Context + question + system instructions</text>

  <line x1="360" y1="386" x2="360" y2="422" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CLAUDE HAIKU -->
  <rect x="230" y="422" width="260" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="444" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Claude Haiku</text>
  <text x="360" y="462" text-anchor="middle" font-size="11" fill="#2563eb">claude-haiku-4-5-20251001 · temp 0.3</text>

  <line x1="360" y1="474" x2="360" y2="510" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RESPONSE -->
  <rect x="240" y="510" width="240" height="52" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="360" y="532" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">Practitioner Response</text>
  <text x="360" y="550" text-anchor="middle" font-size="11" fill="#16a34a">1-2 paragraphs · 2-4 recommendations</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>
</svg>
